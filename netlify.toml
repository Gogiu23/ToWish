# Netlify sirve public/ desde su CDN sin pasar por Next, así que las cabeceras del
# service worker van aquí (las de next.config.ts no le llegan)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self'"
    X-Content-Type-Options = "nosniff"
